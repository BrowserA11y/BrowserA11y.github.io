<!-- Angular focus 7: Focus manager-->
<article
  cdkMonitorSubtreeFocus
  (cdkFocusChange)="elementOrigin = formatOrigin($event); markForCheck()"
  [class]="elementOrigin"
>
  <div class="book__header">
    <h2 class="book__title">{{ book()?.title }}</h2>
    <div class="book__header-actions">
      <button
        type="button"
        class="book__wishlist"
        [attr.aria-pressed]="onWishlist()"
        [attr.aria-label]="wishlistLabel"
        (click)="toggleWishlist()"
      >
        {{ onWishlist() ? "★" : "☆" }}
      </button>
      <!-- Using a visible text label with the icon (or even just visible text, with no icon) would improve accessibility for voice dictation software users. -->
      <button
        #removeButton
        type="button"
        (click)="openRemoveDialog()"
        class="book__text book__close"
      >
        <span class="visually-hidden">Remove {{ book()?.title }}</span>
      </button>
    </div>
  </div>
  <p class="book__text book__author">Author: {{ book()?.author }}</p>
  <p class="book__text book__abstract">{{ book()?.abstract }}</p>
  <!-- Always rendered so cards keep equal height whether available or not -->
  <p class="book__text book__availability">
    @if (book()?.available === false) {
    Currently unavailable
    }
  </p>
  <a class="book__text book__details" [routerLink]="'/details/' + book()?.isbn"
    >Read more <span class="visually-hidden">about {{ book()?.title }}</span></a
  >
</article>

<dialog
  #confirmDialog
  class="book__confirm-dialog"
  aria-labelledby="confirm-remove-title"
>
  <h3 id="confirm-remove-title">Remove book?</h3>
  <p>Remove “{{ book()?.title }}” from the catalog?</p>
  <div class="book__confirm-actions">
    <button type="button" (click)="cancelRemove()">Cancel</button>
    <button type="button" (click)="confirmRemove()">Confirm remove</button>
  </div>
</dialog>
