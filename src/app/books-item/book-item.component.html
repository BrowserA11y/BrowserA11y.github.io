<!-- Angular focus 7: Focus manager-->
<article
  cdkMonitorSubtreeFocus
  (cdkFocusChange)="elementOrigin = formatOrigin($event); markForCheck()"
  [class]="elementOrigin"
>
  <div class="book__header">
    <h2 class="book__title">
      <span class="book__title-clamp">{{ book().title }}</span>
    </h2>
    <div class="book__header-actions">
      <button
        type="button"
        class="book__wishlist"
        [attr.aria-pressed]="onWishlist()"
        [attr.aria-label]="wishlistLabel"
        (click)="toggleWishlist()"
      >
        <svg
          class="book__wishlist-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
          />
        </svg>
      </button>
      <button
        #removeButton
        type="button"
        class="book__remove"
        [attr.aria-label]="removeLabel"
        (click)="openRemoveDialog()"
      >
        ×
      </button>
    </div>
  </div>
  <p class="book__text book__author">Author: {{ book().author }}</p>
  <p class="book__text book__abstract">
    <span class="book__abstract-clamp">{{ book().abstract }}</span>
  </p>
  @if (!book().available) {
  <p class="book__text book__availability">Currently unavailable</p>
  }
  <a class="book__text book__details" [routerLink]="'/details/' + book().isbn"
    >Read more <span class="visually-hidden">about {{ book().title }}</span></a
  >
</article>

<dialog
  #confirmDialog
  class="book__confirm-dialog"
  aria-labelledby="confirm-remove-title"
>
  <h3 id="confirm-remove-title">Remove book?</h3>
  <p>Remove “{{ book().title }}” from the catalog?</p>
  <div class="book__confirm-actions">
    <button type="button" class="book__confirm-action" (click)="cancelRemove()">
      Cancel
    </button>
    <button
      type="button"
      class="book__confirm-action"
      (click)="confirmRemove()"
    >
      Confirm remove
    </button>
  </div>
</dialog>
