<h1>New book</h1>

<!-- Angular focus 8: FormRoot submits on enter -->
<form [formRoot]="newForm">
  <!-- Yes, you can do it (larger clickable area, but just one control allowed): https://developer.mozilla.org/en-US/docs/Web/HTML/Element/label -->
  <label class="form-field" id="isbn-label">
    <!-- Angular focus 9: validation -->
    <!-- DISCUSSION: Star or required?-->
    <!-- Error association via aria-errormessage (+ persistent hint via aria-describedby) -->
    <span>ISBN (required)</span>
    <input
      [formField]="newForm.isbn"
      inputmode="numeric"
      [attr.aria-invalid]="isbnInvalid() || null"
      aria-describedby="isbn-hint"
      [attr.aria-errormessage]="
        isbnRequiredError() || isbnPatternError() ? 'isbn-error' : null
      "
    />
    <small id="isbn-hint" class="form-field__hint">
      Maximum length 13 characters, digits only.
    </small>

    @if (isbnRequiredError()) {
    <small id="isbn-error" class="form-field__error" role="alert">
      Please insert an ISBN.
    </small>
    }
    @if (isbnPatternError() && !isbnRequiredError()) {
    <small id="isbn-error" class="form-field__error" role="alert">
      ISBN must contain digits only.
    </small>
    }
  </label>

  <label for="title" class="form-field" id="title-label">
    Title (required)
  </label>

  <!-- Error association via aria-describedby (alternative to aria-errormessage) -->
  <input
    id="title"
    [formField]="newForm.title"
    [attr.aria-invalid]="titleInvalid() || null"
    [attr.aria-describedby]="titleShowsError() ? 'title-error' : null"
  />
  <!-- Angular focus 10: *ngIf + dirty
  Resource: https://coryrylan.com/blog/build-accessible-forms-with-angular
  DISCUSSION: Single or all at once?-->
  @if (titleShowsError()) {
  <small id="title-error" class="form-field__error" role="alert">
    Please insert a title.
  </small>
  }
  <label class="form-field">
    <span>Author</span>
    <input [formField]="newForm.author" />
  </label>
  <label class="form-field">
    <span>Cover-URL</span>
    <input [formField]="newForm.cover" />
  </label>
  <label class="form-field">
    <span>Abstract</span>
    <input [formField]="newForm.abstract" />
  </label>
  <!--DICUSSION: To disable or not to disable?
  Alternative: https://medium.com/@svinkle/creating-accessible-forms-with-angular-simply-accessible-c1bc362cf89e
  https://www.thisdot.co/blog/make-it-accessible-dealing-with-form-errors-in-angular-->
  <div class="form__actions">
    <button type="submit" [disabled]="newForm().invalid()">Add a new book</button>
  </div>
</form>
