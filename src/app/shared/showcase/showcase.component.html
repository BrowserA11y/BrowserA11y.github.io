<article class="showcase">
  <div class="showcase__icon" aria-hidden="true">
    <ng-content select="[showcaseIcon]" />
  </div>
  <h2 class="showcase__title">
    <a class="showcase__link" [routerLink]="link()">{{ title() }}</a>
  </h2>
  <p class="showcase__description">{{ description() }}</p>
</article>
